  /knowledge-base:
    get:
      operationId: listKnowledgeBase
      tags: [knowledge-base]
      summary: List knowledge base documents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeDoc"
    post:
      operationId: createKnowledgeDoc
      tags: [knowledge-base]
      summary: Upload a document to knowledge base
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDocInput"
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDoc"

  /knowledge-base/{id}:
    get:
      operationId: getKnowledgeDoc
      tags: [knowledge-base]
      summary: Get knowledge base document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDoc"
    delete:
      operationId: deleteKnowledgeDoc
      tags: [knowledge-base]
      summary: Delete a knowledge base document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted

  /knowledge-base/search:
    post:
      operationId: searchKnowledgeBase
      tags: [knowledge-base]
      summary: Semantic search over knowledge base
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchInput"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeSearchResult"

  # ─── AI SETTINGS ────────────────────────────────────────────────────────────
  /ai-settings:
    get:
      operationId: getAiSettings
      tags: [ai-settings]
      summary: Get AI settings for organization
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
    put:
      operationId: updateAiSettings
      tags: [ai-settings]
      summary: Update AI settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSettingsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"

  # ─── ANALYTICS ──────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getDashboardStats
      tags: [analytics]
      summary: Get dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /analytics/conversations:
    get:
      operationId: getConversationAnalytics
      tags: [analytics]
      summary: Get conversation analytics over time
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: "30d"
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationAnalytics"

  /analytics/agents:
    get:
      operationId: getAgentPerformance
      tags: [analytics]
      summary: Get agent performance metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Agent performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentPerformance"

  # ─── INTEGRATIONS ────────────────────────────────────────────────────────────
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List available integrations and their status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Integration"

  /integrations/{provider}/configure:
    post:
      operationId: configureIntegration
      tags: [integrations]
      summary: Configure an integration provider
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [whatsapp_cloud, whatsapp_web, messenger, instagram, telegram, tiktok]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationConfig"
      responses:
        "200":
          description: Configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── AUTH ─────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string

        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password, firstName, lastName, organizationName]
      properties:
        email:
          type: string

        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        organizationName:
          type: string

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthResult:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ─── ORGANIZATION ─────────────────────────────────────────────────────────
    Organization:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
        createdAt:
          type: string
          format: date-time

    OrganizationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type: string

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
        website:
          type: string
        logoUrl:
          type: string

    # ─── USER ─────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt]
      properties:
        id:
          type: number
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: ["string", "null"]
        role:
          type: string
          enum: [owner, admin, agent]
        isActive:
          type: boolean
        organizationId:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    UserInviteInput:
      type: object
      required: [email, firstName, lastName, role]
      properties:
        email:
          type: string

        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, agent]

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, agent]
        isActive:
          type: boolean

    # ─── CONTACT ──────────────────────────────────────────────────────────────
    Contact:
      type: object
      required: [id, firstName, lastName, createdAt]
      properties:
        id:
          type: number
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        companyId:
          type: ["number", "null"]
        companyName:
          type: ["string", "null"]
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        lastActivityAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    ContactInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        companyId:
          type: number
        tagIds:
          type: array
          items:
            type: number

    ContactUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        companyId:
          type: ["number", "null"]
        tagIds:
          type: array
          items:
            type: number

    # ─── COMPANY ──────────────────────────────────────────────────────────────
    Company:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        domain:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        contactCount:
          type: number
        createdAt:
          type: string
          format: date-time

    CompanyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        size:
          type: string

    CompanyUpdate:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        industry:
          type: string
        size:
          type: string

    # ─── CONVERSATION ─────────────────────────────────────────────────────────
    Conversation:
      type: object
      required: [id, status, channelType, createdAt]
      properties:
        id:
          type: number
        status:
          type: string
          enum: [open, resolved, pending, snoozed]
        channelType:
          type: string
          enum: [whatsapp, messenger, instagram, telegram, tiktok, web]
        channelId:
          type: ["number", "null"]
        contactId:
          type: ["number", "null"]
        contact:
          $ref: "#/components/schemas/Contact"
        assigneeId:
          type: ["number", "null"]
        assignee:
          $ref: "#/components/schemas/User"
        subject:
          type: ["string", "null"]
        lastMessageAt:
          type: ["string", "null"]
          format: date-time
        lastMessage:
          type: ["string", "null"]
        unreadCount:
          type: number
        aiHandled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ConversationInput:
      type: object
      required: [channelType]
      properties:
        channelType:
          type: string
          enum: [whatsapp, messenger, instagram, telegram, tiktok, web]
        channelId:
          type: number
        contactId:
          type: number
        subject:
          type: string
        assigneeId:
          type: number

    ConversationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, resolved, pending, snoozed]
        assigneeId:
          type: ["number", "null"]
        subject:
          type: string

    AssignInput:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: ["number", "null"]

    # ─── MESSAGE ──────────────────────────────────────────────────────────────
    Message:
      type: object
      required: [id, conversationId, content, senderType, createdAt]
      properties:
        id:
          type: number
        conversationId:
          type: number
        content:
          type: string
        senderType:
          type: string
          enum: [contact, agent, ai, system]
        senderId:
          type: ["number", "null"]
        senderName:
          type: ["string", "null"]
        messageType:
          type: string
          enum: [text, image, file, audio, video]
        status:
          type: string
          enum: [sent, delivered, read, failed]
        isPrivate:
          type: boolean
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        messageType:
          type: string
          enum: [text, image, file, audio, video]
          default: text
        isPrivate:
          type: boolean

    # ─── CHANNEL ──────────────────────────────────────────────────────────────
    Channel:
      type: object
      required: [id, name, channelType, provider, isActive, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        channelType:
          type: string
          enum: [whatsapp, messenger, instagram, telegram, tiktok, web]
        provider:
          type: string
          enum: [whatsapp_cloud, whatsapp_web, meta_graph, instagram_graph, telegram_bot, tiktok_dm, web_widget]
        isActive:
          type: boolean
        phoneNumber:
          type: ["string", "null"]
        pageId:
          type: ["string", "null"]
        conversationCount:
          type: number
        createdAt:
          type: string
          format: date-time

    ChannelInput:
      type: object
      required: [name, channelType, provider]
      properties:
        name:
          type: string
        channelType:
          type: string
          enum: [whatsapp, messenger, instagram, telegram, tiktok, web]
        provider:
          type: string
          enum: [whatsapp_cloud, whatsapp_web, meta_graph, instagram_graph, telegram_bot, tiktok_dm, web_widget]

    ChannelUpdate:
      type: object
      properties:
        name:
          type: string
        isActive:
          type: boolean

    # ─── NOTE ─────────────────────────────────────────────────────────────────
    Note:
      type: object
      required: [id, content, authorId, createdAt]
      properties:
        id:
          type: number
        content:
          type: string
        authorId:
          type: number
        authorName:
          type: string
        contactId:
          type: ["number", "null"]
        conversationId:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    NoteInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
        contactId:
          type: number
        conversationId:
          type: number

    NoteUpdate:
      type: object
      properties:
        content:
          type: string

    # ─── TAG ──────────────────────────────────────────────────────────────────
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id:
          type: number
        name:
          type: string
        color:
          type: string

    TagInput:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
        color:
          type: string

    # ─── PIPELINE ─────────────────────────────────────────────────────────────
    Pipeline:
      type: object
      required: [id, name, stages, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        stages:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"
        dealCount:
          type: number
        totalValue:
          type: number
        createdAt:
          type: string
          format: date-time

    PipelineStage:
      type: object
      required: [id, name, order]
      properties:
        id:
          type: number
        name:
          type: string
        order:
          type: number
        color:
          type: ["string", "null"]

    PipelineInput:
      type: object
      required: [name, stages]
      properties:
        name:
          type: string
        stages:
          type: array
          items:
            type: object
            required: [name, order]
            properties:
              name:
                type: string
              order:
                type: number
              color:
                type: string

    PipelineUpdate:
      type: object
      properties:
        name:
          type: string

    # ─── DEAL ─────────────────────────────────────────────────────────────────
    Deal:
      type: object
      required: [id, title, pipelineId, stage, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        pipelineId:
          type: number
        pipelineName:
          type: ["string", "null"]
        stage:
          type: string
        value:
          type: ["number", "null"]
        currency:
          type: string
        contactId:
          type: ["number", "null"]
        contactName:
          type: ["string", "null"]
        assigneeId:
          type: ["number", "null"]
        assigneeName:
          type: ["string", "null"]
        expectedCloseDate:
          type: ["string", "null"]

        probability:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    DealInput:
      type: object
      required: [title, pipelineId, stage]
      properties:
        title:
          type: string
        pipelineId:
          type: number
        stage:
          type: string
        value:
          type: number
        currency:
          type: string
          default: USD
        contactId:
          type: number
        assigneeId:
          type: number
        expectedCloseDate:
          type: string

        probability:
          type: number

    DealUpdate:
      type: object
      properties:
        title:
          type: string
        stage:
          type: string
        value:
          type: ["number", "null"]
        contactId:
          type: ["number", "null"]
        assigneeId:
          type: ["number", "null"]
        expectedCloseDate:
          type: ["string", "null"]

        probability:
          type: ["number", "null"]

    # ─── KNOWLEDGE BASE ───────────────────────────────────────────────────────
    KnowledgeDoc:
      type: object
      required: [id, title, fileType, status, createdAt]
      properties:
        id:
          type: number
        title:
          type: string
        fileType:
          type: string
          enum: [pdf, docx, txt, url, faq]
        status:
          type: string
          enum: [pending, processing, ready, failed]
        fileSize:
          type: ["number", "null"]
        chunkCount:
          type: ["number", "null"]
        createdAt:
          type: string
          format: date-time

    KnowledgeDocInput:
      type: object
      required: [title, fileType]
      properties:
        title:
          type: string
        fileType:
          type: string
          enum: [pdf, docx, txt, url, faq]
        content:
          type: string
        fileUrl:
          type: string
        url:
          type: string

    KnowledgeSearchInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
        topK:
          type: number
          default: 5

    KnowledgeSearchResult:
      type: object
      required: [docId, docTitle, chunk, score]
      properties:
        docId:
          type: number
        docTitle:
          type: string
        chunk:
          type: string
        score:
          type: number

    # ─── AI SETTINGS ──────────────────────────────────────────────────────────
    AiSettings:
      type: object
      required: [id, organizationId, provider, model, autoReplyEnabled]
      properties:
        id:
          type: number
        organizationId:
          type: number
        provider:
          type: string
          enum: [ollama, openai_compatible]
        model:
          type: string
        baseUrl:
          type: ["string", "null"]
        systemPrompt:
          type: ["string", "null"]
        autoReplyEnabled:
          type: boolean
        confidenceThreshold:
          type: number
        escalateOnLowConfidence:
          type: boolean
        contextWindowSize:
          type: number
        maxTokens:
          type: number
        temperature:
          type: number

    AiSettingsInput:
      type: object
      properties:
        provider:
          type: string
          enum: [ollama, openai_compatible]
        model:
          type: string
        baseUrl:
          type: string
        systemPrompt:
          type: string
        autoReplyEnabled:
          type: boolean
        confidenceThreshold:
          type: number
        escalateOnLowConfidence:
          type: boolean
        contextWindowSize:
          type: number
        maxTokens:
          type: number
        temperature:
          type: number

    # ─── ANALYTICS ────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalConversations, openConversations, resolvedToday, avgResponseTime, aiHandledPercent, totalContacts, totalDealsValue, recentActivity]
      properties:
        totalConversations:
          type: number
        openConversations:
          type: number
        resolvedToday:
          type: number
        avgResponseTime:
          type: number
          description: Average response time in minutes
        aiHandledPercent:
          type: number
        totalContacts:
          type: number
        totalDealsValue:
          type: number
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: number
        type:
          type: string
          enum: [conversation_opened, conversation_resolved, contact_created, deal_created, message_sent]
        description:
          type: string
        actorName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    ConversationAnalytics:
      type: object
      required: [dataPoints, summary]
      properties:
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDataPoint"
        summary:
          type: object
          required: [total, resolved, avgResponseTime, aiHandled]
          properties:
            total:
              type: number
            resolved:
              type: number
            avgResponseTime:
              type: number
            aiHandled:
              type: number

    AnalyticsDataPoint:
      type: object
      required: [date, opened, resolved, aiHandled]
      properties:
        date:
          type: string

        opened:
          type: number
        resolved:
          type: number
        aiHandled:
          type: number

    AgentPerformance:
      type: object
      required: [userId, name, conversationsHandled, avgResponseTime, resolvedCount, satisfactionScore]
      properties:
        userId:
          type: number
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        conversationsHandled:
          type: number
        avgResponseTime:
          type: number
        resolvedCount:
          type: number
        satisfactionScore:
          type: ["number", "null"]

    # ─── INTEGRATIONS ─────────────────────────────────────────────────────────
    Integration:
      type: object
      required: [provider, channelType, displayName, isConfigured, isActive]
      properties:
        provider:
          type: string
          enum: [whatsapp_cloud, whatsapp_web, messenger, instagram, telegram, tiktok]
        channelType:
          type: string
        displayName:
          type: string
        description:
          type: string
        isConfigured:
          type: boolean
        isActive:
          type: boolean
        iconUrl:
          type: ["string", "null"]

    IntegrationConfig:
      type: object
      properties:
        accessToken:
          type: string
        phoneNumberId:
          type: string
        businessAccountId:
          type: string
        pageId:
          type: string
        webhookVerifyToken:
          type: string
        apiKey:
          type: string
